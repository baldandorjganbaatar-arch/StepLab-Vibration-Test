
name: Build StepLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract project ZIP
        run: |
          unzip -o StepLab_V3_Download.zip -d extracted

      - name: Build APK
        working-directory: extracted/StepLab_Vibration_Test
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StepLab-APK
          path: extracted/StepLab_Vibration_Test/app/build/outputs/apk/debug/app-debug.apk
